# Filtering rules for job posts.
# Keep this file in the repo — it's not secret.
# Secrets (Telegram token / chat id) live in environment variables / GitHub secrets.

filter:
  # The job TITLE must contain at least one of these.
  # This is the strict gate — prevents jobs where "react" only appears once
  # deep in the description (e.g. a robotics company listing all their tools).
  title_include_any:
    - frontend
    - front-end
    - front end
    - react
    - next.js
    - nextjs
    - ui developer
    - ui engineer
    - web developer
    - javascript developer
    - typescript developer
    - fullstack
    - full-stack
    - full stack

  # Full text (title + description + tags) must also contain at least one of these.
  # Keeps the match honest even for sources that have rich tag/description data.
  include_any:
    - frontend
    - front-end
    - front end
    - react
    - next.js
    - nextjs
    - javascript
    - typescript
    - web developer
    - node.js
    - nodejs

  # If the job matches ANY of these, it's dropped (case-insensitive).
  exclude_any:
    - principal
    - staff engineer
    - engineering manager
    - head of
    - cto
    - founding engineer
    - unpaid
    - commission only
    - php
    - wordpress
    - solidity
    - blockchain
    - web3
    - crypto
    - sales
    - recruiter
    - clearance
    # Residency-restricted jobs — remote, but only for locals of a country
    # that's out of reach. Matched against the full text, so these are spelled
    # out as phrases; bare country names live under filter.geo.exclude_any.
    - us only
    - usa only
    - united states only
    - north america only
    - must be located in the us
    - must reside in the us
    - must be based in the us
    - authorized to work in the us
    - us work authorization
    - us citizens only
    - us residents only
    - canada only
    - canadian residents
    - must be based in canada
    - australia only
    - must be based in australia
    - new zealand only
    - germany only
    - must be based in germany
    - must reside in germany
    - german language required
    - fluent german
    - german speaking
    - work permit required
    - visa sponsorship not available
    - we do not sponsor
    - no visa sponsorship

  # If true, run the three-step geo gate below (always_allow -> exclude -> allow).
  require_allowed_geo: true

  # Where you can realistically work. An entry starting with "re:" is a regex;
  # everything else is a plain phrase (single words match on word boundaries,
  # multi-word phrases match as substrings). All matching is case-insensitive.
  geo:
    # Step 1 — hard keep. Matched against the WHOLE post (title + description).
    # A post that asks for Ukrainian, or names Ukraine/Croatia/Slovakia, can
    # hire from there no matter where the company itself sits, so it survives
    # even if a blocked country is mentioned too.
    always_allow_any:
      - ukraine
      - ukrainian
      - kyiv
      - kiev
      - lviv
      - kharkiv
      - odesa
      - odessa
      - dnipro
      - croatia
      - croatian
      - zagreb
      - rijeka
      - osijek
      - slovakia
      - slovak
      - bratislava
      - kosice
      - "košice"

    # Step 2 — blocked countries: visa/relocation impossible, or the post is
    # restricted to local residents.
    # Matched ONLY against the geo-bearing fields (title + location + tags),
    # never the description — otherwise "we have an office in Toronto" would
    # sink an otherwise fine worldwide-remote post.
    exclude_any:
      # --- United States ---
      - united states
      - "re:\\busa\\b"
      - "re:\\bu\\.s\\.a?\\b"
      - "re:\\(\\s*us\\b"                                # "REMOTE (US)", "(US & Canada)"
      - "re:\\|\\s*us\\b"                                # "| US" — pipe-separated location
      - "re:\\bus\\s*[&/+]\\s*canada\\b"
      - "re:\\bus[\\s\\-]?(?:only|based|remote|citizens?|residents?)\\b"
      - "re:\\bremote\\s*[-:|–—]?\\s*us\\b"            # "Remote US", "REMOTE - US"
      - north america
      - americas
      # "City, ST" — only the state codes that aren't also English words
      # (OR/IN/ME/OK/HI/DE/LA/CO are deliberately left out).
      - "re:,\\s*(?:ca|tx|ny|nj|pa|ma|il|fl|ga|nc|sc|va|wa|az|nv|ut|mn|mi|oh|tn|mo|wi|ct|md)\\b"
      - san francisco
      - bay area
      - silicon valley
      - new york
      - nyc
      - brooklyn
      - los angeles
      - san diego
      - san jose
      - palo alto
      - mountain view
      - seattle
      - austin
      - boston
      - chicago
      - denver
      - boulder
      - atlanta
      - dallas
      - houston
      - miami
      - portland
      - phoenix
      - philadelphia
      - minneapolis
      - nashville
      - washington dc
      # --- Canada ---
      - canada
      - canadian
      - toronto
      - vancouver
      - montreal
      - ottawa
      - calgary
      # --- Australia / New Zealand ---
      - australia
      - australian
      - sydney
      - melbourne
      - brisbane
      - perth
      - new zealand
      - auckland
      - wellington
      # --- Germany ---
      - germany
      - german
      - berlin
      - munich
      - "münchen"
      - hamburg
      - frankfurt
      - cologne
      - "köln"
      - "düsseldorf"
      - dusseldorf
      - stuttgart
      - nuremberg
      - leipzig
      - dresden
      # --- Outside Europe entirely ---
      - india
      - bengaluru
      - bangalore
      - mumbai
      - delhi
      - hyderabad
      - pune
      - chennai
      - latam
      - latin america
      - colombia
      - bogota
      - brazil
      - brasil
      - sao paulo
      - "são paulo"
      - argentina
      - buenos aires
      - mexico
      - chile
      - peru
      - philippines
      - manila
      - indonesia
      - vietnam
      - singapore
      - japan
      - tokyo
      - china
      - hong kong
      - dubai
      - uae
      - israel
      - tel aviv
      - south africa
      - cape town
      - nigeria
      - kenya
      # --- Language markers ---
      # A posting written in German or Spanish/Portuguese is aimed at a market
      # you can't serve, whatever the location field says.
      - m/w/d
      - w/m/d
      - m/f/d
      - entwickler
      - entwicklerin
      - festanstellung
      - unbefristet
      - desarrollador
      - desarrolladora
      - programador
      - desenvolvedor

    # Step 3 — the post must mention at least one of these somewhere, or it's
    # dropped. Remote / Europe-wide / worldwide keeps the feed full; the named
    # countries are the ones where a local or B2B contract is realistic.
    # Leave the list empty to accept anything that survived step 2.
    allow_any:
      # remote-first phrasing
      - remote
      - europe
      - european
      - eu
      - emea
      - worldwide
      - anywhere
      # Croatia / Slovakia / Ukraine
      - croatia
      - zagreb
      - slovakia
      - bratislava
      - kosice
      - ukraine
      - ukrainian
      - kyiv
      - kiev
      - lviv
      - kharkiv
      - odesa
      # Poland / Czechia
      - poland
      - polish
      - warsaw
      - warszawa
      - krakow
      - "kraków"
      - wroclaw
      - gdansk
      - poznan
      - czech
      - czechia
      - prague
      - praha
      - brno
      # Baltics
      - estonia
      - tallinn
      - tartu
      - latvia
      - riga
      - lithuania
      - vilnius
      - kaunas
      # Portugal / Spain
      - portugal
      - lisbon
      - lisboa
      - porto
      - spain
      - madrid
      - barcelona
      - valencia
      - malaga
      # Austria
      - austria
      - vienna
      - wien
      - graz

    # Boards that only ever list remote work. Their posts skip step 3, because
    # many never spell the word "remote" out in the body. Step 2 still applies,
    # so a "REMOTE (US)" post from one of these is still dropped.
    remote_sources:
      - remoteok
      - weworkremotely
      - remotive

# Which job boards to poll. Drop or comment any you don't want.
sources:
  - name: hackernews
    # Leave thread_id blank to auto-discover the current month's
    # "Ask HN: Who is hiring?" thread.
    thread_id: null
    max_comments: 400

  - name: remoteok

  - name: weworkremotely

  - name: justjoinit
    max_pages: 2
    per_page: 100

  - name: arbeitnow

  - name: remotive

  - name: djinni
    # keywords to search on djinni.co RSS feed
    keywords:
      - JavaScript
      - TypeScript
      - React
      - Frontend
    # english_level: "" means any level (blank = no filter)
    english_level: ""

  - name: dou
    # jobs.dou.ua category feeds (names must match DOU's own category labels).
    categories:
      - Front End
      - Fullstack
      - JavaScript
      - Node.js
    # Company slugs to follow directly — the bit after /companies/ in the URL.
    # Company feeds surface postings that never show up in a category feed.
    companies:
      - techmagic
    # true = only pull the "віддалено" (remote) slice of each category feed.
    remote_only: false

# How many jobs to send in one bot run, max. Prevents spam on first run.
max_per_run: 30

# Path to the dedupe state file (kept inside the repo by default).
state_path: seen.json
